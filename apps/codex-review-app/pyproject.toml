[project]
name = "codex-review-app"
version = "0.1.0"
description = "Local chart and agent-decision review for one recorded trading session"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Mitchell Foutz" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

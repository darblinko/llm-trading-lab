[project]
name = "claude-review-app"
version = "0.1.0"
description = "Read-only chart and agent-decision review for one recorded trading session"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Mitchell Foutz" }]
requires-python = ">=3.12,<3.14"
dependencies = ["numpy==2.2.6", "pandas==3.0.1", "pandas-ta==0.4.71b0"]

[project.optional-dependencies]
alpaca = ["alpaca-py==0.43.2"]

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
